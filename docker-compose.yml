services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  workflow_pgdata:
